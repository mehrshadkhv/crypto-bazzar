name: crypto_bazzar
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_spinkit: ^5.2.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  

  fonts:
    - family: mr
      fonts:
        - asset: assets/fonts/mh.ttf
    - family: iranYekan
      fonts:
        - asset: assets/fonts/iyl.ttf
